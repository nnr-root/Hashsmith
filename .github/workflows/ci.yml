name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # nightly slow-KDF vectors

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: hashsmith/go_hashsmith/go.sum
      - name: Build
        run: cd hashsmith/go_hashsmith && CGO_ENABLED=0 go build ./...
      - name: Vet
        run: cd hashsmith/go_hashsmith && go vet ./...
      # HASHSMITH_REQUIRE_AVX2 makes this job the declared gate for the AVX2
      # assembly cores (md5avx2_amd64.s, md4avx2_amd64.s). The cores are
      # selected by BUILD TAG, so an amd64 build always links them and the
      # differential tests always execute them — but this variable turns that
      # from an invariant into an assertion: with it set,
      # TestMD4AVX2CoreWasActuallyExercised FAILS (rather than skips) unless
      # the assembly was linked, the CPU really reports AVX2, and the live
      # backend resolves md4/ntlm to the AVX2 MD4 core. Development happens on
      # an arm64 Mac where hasAVX2() is false, so without this assertion a
      # wrong AVX2 core could land green everywhere the author can run it.
      # Do NOT set this on the arm64 lane, where the fallback is correct.
      - name: Test (fast vectors)
        env:
          HASHSMITH_REQUIRE_AVX2: "1"
        run: cd hashsmith/go_hashsmith && go test -timeout 5m ./...

  test-arm64:
    # ubuntu-24.04-arm is GitHub's hosted arm64 runner. This is the only job
    # in this workflow that actually EXECUTES the NEON assembly: the `test`
    # job above runs on amd64, where md5Group/md4Group resolve to the generic
    # fallbacks (and md5GroupAVX2/md4GroupAVX2 resolve to the AVX2 assembly
    # instead), and the `cross-compile` job below builds the arm64 binary but
    # discards it without ever running it. Without this lane, the arm64 NEON
    # assembly in md5neon_arm64.s and md4neon_arm64.s would never be exercised
    # by CI. Mirrors the `test` job's steps, minus HASHSMITH_REQUIRE_AVX2,
    # which asserts the opposite architecture's core.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: hashsmith/go_hashsmith/go.sum
      - name: Build
        run: cd hashsmith/go_hashsmith && CGO_ENABLED=0 go build ./...
      - name: Vet
        run: cd hashsmith/go_hashsmith && go vet ./...
      - name: Test (fast vectors)
        run: cd hashsmith/go_hashsmith && go test -timeout 5m ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # The race detector is what guards the concurrent keyspace runner added
      # in Phase 1. Two tests are excluded: TestBenchTypeRespectsBudgetForSlowKDF
      # and TestFastVectorsStayWithinBudget. Both are wall-clock budget
      # assertions, and a race build carries ~10x instrumentation overhead —
      # under -race such a test measures the instrumentation, not the code, so
      # an absolute millisecond threshold isn't merely strained there, it's
      # meaningless. Do not "fix" this by loosening either budget: that would
      # weaken these tests in the normal lane, which is where they actually do
      # their job (e.g. catching a self-test vector that silently became a
      # high-iteration KDF). Excluding them from a lane where they cannot be
      # meaningful is the correct trade, applied consistently to both. Races in
      # this file's code are still covered by the other tests in this lane.
      - name: Test (race detector)
        env:
          HASHSMITH_REQUIRE_AVX2: "1"   # amd64 runner: see the `test` job's note
        run: |
          cd hashsmith/go_hashsmith
          go test -race -timeout 20m \
            -skip 'TestBenchTypeRespectsBudgetForSlowKDF|TestFastVectorsStayWithinBudget' ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: hashsmith/go_hashsmith/go.sum
      - name: Cross-compile all targets
        run: |
          cd hashsmith/go_hashsmith
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/hashsmith
          done

  gpu-build:
    # The GPU backends need cgo; the CPU vector cores are Go assembly. Go
    # forbids ONE package from holding both, which is why the cgo code lives in
    # internal/gpubackend and package main keeps the assembly. That separation
    # is invisible to every other job here — the default build is pure Go and
    # never compiles a GPU backend — so `-tags gpu` broke once and stayed broken
    # for an entire development session across six green jobs. This job exists
    # solely to make that failure loud.
    #
    # Build-only, deliberately: compiling the kernels needs no GPU present, and
    # hosted runners have no usable one. macOS carries both the Metal and the
    # OpenCL frameworks, so one runner covers both backends.
    #
    # NOT covered: OpenCL on Linux (needs ocl-icd-opencl-dev) and any actual
    # kernel EXECUTION. A kernel that compiles but computes the wrong digest
    # would still pass this job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: hashsmith/go_hashsmith/go.sum
      - name: Build Metal backend (-tags gpu)
        run: cd hashsmith/go_hashsmith && CGO_ENABLED=1 go build -tags gpu -o /dev/null ./cmd/hashsmith
      - name: Build OpenCL backend (-tags opencl)
        run: cd hashsmith/go_hashsmith && CGO_ENABLED=1 go build -tags opencl -o /dev/null ./cmd/hashsmith
      - name: Default build must stay pure Go (no cgo)
        run: cd hashsmith/go_hashsmith && CGO_ENABLED=0 go build -o /dev/null ./cmd/hashsmith
      # The OpenCL kernels are the path for NVIDIA, AMD and Intel, but they have
      # only ever been RUN against Apple's OpenCL — the one implementation the
      # developers have. A construct that Apple accepts and another vendor
      # rejects would surface as a kernel build failure on a user's card, which
      # is the worst possible place to find out.
      #
      # clang compiles OpenCL C against the vendor-neutral spec, so this pins the
      # kernels to OpenCL 1.2 without needing any GPU. It catches non-portable
      # syntax and OpenCL 2.x-only builtins; it does NOT prove the kernels
      # compute correct digests on other vendors, which still rests on the spec
      # plus the Apple-side self-test.
      - name: OpenCL kernels must be valid vendor-neutral OpenCL 1.2
        run: |
          cd hashsmith/go_hashsmith/internal/gpubackend
          clang -x cl -cl-std=CL1.2 -Xclang -finclude-default-header \
            -Werror -fsyntax-only opencl_kernels.cl

  bench:
    # Throughput measurement for the vector cores. These run on BOTH
    # architectures because the two backends are different code: arm64
    # exercises the NEON cores, x86 exercises the AVX2 one. Development
    # happens on an Apple laptop whose Rosetta exposes no AVX at all, and
    # whose Docker amd64 emulation is QEMU/TCG — which executes vector
    # instructions lane-by-lane and is therefore biased AGAINST SIMD. So a
    # trustworthy x86 number can only come from here.
    #
    # -cpu 1 and a single invocation per arch keep each vector/scalar pair
    # same-run, which is what makes the RATIO meaningful even though hosted
    # runners are shared and their absolute figures drift.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: hashsmith/go_hashsmith/go.sum
      - name: CPU features
        run: |
          echo "arch: ${{ matrix.arch }}"
          grep -m1 -E '^(model name|Model)' /proc/cpuinfo || true
          grep -o -m1 -E '\b(avx512[a-z]*|avx2|avx|asimd|neon)\b' /proc/cpuinfo | sort -u | tr '\n' ' ' || true
          echo
      - name: Vector core benchmarks (best-of-5, same invocation)
        run: |
          cd hashsmith/go_hashsmith
          go test -run '^$' -bench 'BenchmarkMD5AVX2Core|BenchmarkMD5NeonCore|BenchmarkMD5AVX2Group|BenchmarkMD5Group|BenchmarkMD5Scalar|BenchmarkMD4AVX2Group|BenchmarkMD4Group|BenchmarkMD4Scalar' \
            -benchtime 2s -count 5 -cpu 1 ./cmd/hashsmith | tee /tmp/bench.out
      - name: End-to-end crack rate (fast path vs forced-scalar, same binary)
        run: |
          cd hashsmith/go_hashsmith
          go build -o /tmp/hs ./cmd/hashsmith
          K=308915776   # 6-char lowercase; hash below is deliberately NOT in it,
          MISS=00000000000000000000000000000001   # so both sides exhaust the space
          # How the scalar side is forced, and why it is no longer --session:
          # a --session brute/mask run of an unsalted md5/md4/ntlm now goes
          # through the SAME vector runner as an unsessioned one (resumable
          # runs used to pay ~10x for nothing). Keeping --session here would
          # quietly turn this A/B into fast-vs-fast. HASHSMITH_NO_FASTPATH=1
          # makes fastPathEligible decline instead — that is the single gate
          # choosing between the two runners, so the same binary enumerates
          # the same candidates to the same result, only with the scalar
          # enumerator. Nothing else about the run differs. The third row is
          # the regression guard: --session must now sit on the fast side.
          run() {  # $1=label, $2=env assignments ("" for none), $3...=extra flags
            local label="$1"; local envs="$2"; shift 2
            local best=99999
            for i in 1 2 3; do
              local t
              rm -rf ~/.hashsmith/sessions/cibench* 2>/dev/null || true
              t=$( { env $envs /usr/bin/time -f %e /tmp/hs crack -t md5 -M brute \
                     -C abcdefghijklmnopqrstuvwxyz -n 6 -x 6 -p "$(nproc)" \
                     "$MISS" -N --no-pot "$@" >/dev/null; } 2>&1 | tail -1 )
              best=$(awk -v a="$t" -v b="$best" 'BEGIN{print (a<b)?a:b}')
            done
            awk -v k=$K -v t="$best" -v l="$label" \
              'BEGIN{printf "E2E %-16s best %7.2fs -> %7.2f MH/s\n", l, t, k/t/1e6}'
          }
          run "fast-path"     ""
          run "forced-scalar" "HASHSMITH_NO_FASTPATH=1"
          run "fast+session"  "" --session cibench
          rm -rf ~/.hashsmith/sessions/cibench* 2>/dev/null || true
          echo "=================== SUMMARY (sorted MH/s, best last) ==================="
          for n in BenchmarkMD5AVX2Core BenchmarkMD5NeonCore BenchmarkMD5AVX2Group BenchmarkMD5Group BenchmarkMD5Scalar BenchmarkMD4AVX2Group BenchmarkMD4Group BenchmarkMD4Scalar; do
            vals=$(grep "^$n" /tmp/bench.out | grep -oE '[0-9.]+ MH/s' | sort -n | tr '\n' ' ')
            [ -n "$vals" ] && echo "$n: $vals"
          done

  slow-vectors:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: hashsmith/go_hashsmith/go.sum
      - name: Test (all vectors incl. slow KDFs)
        run: cd hashsmith/go_hashsmith && go test -tags slowtest -timeout 60m ./...
