[metadata]
name = hashsmith-cli
version = 1.2.0
description = Hashsmith CLI for encoding, decoding, hashing, and cracking
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Salih Sefer
url = https://github.com/s4l1hs/Hashsmith

[options]
packages = find:
include_package_data = True
python_requires = >=3.9

[options.package_data]
# The wheel must carry a Go tree that actually builds. Listing only
# cmd/hashsmith/*.go left out the hand-written assembly the NEON and AVX2
# cores are implemented in, so `go build` failed with "missing function body"
# on every arm64 and amd64 host. internal/ is needed for the same reason:
# bcryptlane, argon2d, hashid and gpubackend are imported by the CLI.
hashsmith =
    go_hashsmith/go.mod
    go_hashsmith/go.sum
    go_hashsmith/cmd/hashsmith/*.go
    go_hashsmith/cmd/hashsmith/*.s
    go_hashsmith/cmd/hashsmith/*.txt
    go_hashsmith/cmd/hashsmith/rules/*.rule
    go_hashsmith/internal/*/*.go
    go_hashsmith/internal/*/*.c
    go_hashsmith/internal/*/*.h
    go_hashsmith/internal/*/*.m
    go_hashsmith/internal/*/*.cl
    go_hashsmith/internal/bcryptlane/LICENSE

[options.entry_points]
console_scripts =
    hashsmith = hashsmith.cli:main
